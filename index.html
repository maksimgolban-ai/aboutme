<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Максим Голбан — Финансы и управление</title>

  <style>
    :root{
      --bg0:#0b1020;
      --bg1:#0d1630;
      --card:#0f1a35cc;
      --stroke:#ffffff1a;
      --text:#e8ecff;
      --muted:#b7c0e6;
      --accent:#7c5cff;
      --accent2:#2fd3c8;
      --radius:18px;
      --shadow:0 18px 50px rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 80% 10%, rgba(47,211,200,.18), transparent 60%),
        linear-gradient(180deg,var(--bg0),var(--bg1));
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:28px 18px 60px;
    }

    /* HERO */
    .hero{
      border:1px solid var(--stroke);
      border-radius:22px;
      padding:24px;
      background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
      box-shadow:var(--shadow);
    }

    .hero-grid{
      display:grid;
      grid-template-columns: 1fr 280px;
      gap:24px;
      align-items:center;
    }

    /* PHOTO */
    .photo-wrap{
      position:relative;
      border-radius:22px;
      padding:4px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
    }

    .photo-wrap::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:22px;
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(6px);
      pointer-events:none;
    }

    .photo{
      display:block;
      width:100%;
      border-radius:18px;
      object-fit:cover;
      background:#111;
    }

    /* TEXT */
    .badge{
      display:inline-block;
      padding:8px 14px;
      border-radius:999px;
      font-size:13px;
      color:var(--muted);
      border:1px solid var(--stroke);
      margin-bottom:10px;
    }

    h1{
      margin:6px 0 8px;
      font-size:clamp(28px,4vw,44px);
      font-weight:800;
      line-height:1.1;
      background:linear-gradient(90deg,#fff,#cfd8ff 40%,#2fd3c8);
      -webkit-background-clip:text;
      color:transparent;
    }

    .subtitle{
      color:var(--muted);
      max-width:70ch;
      font-size:15px;
    }

    /* RESPONSIVE */
    @media (max-width:900px){
      .hero-grid{
        grid-template-columns:1fr;
      }
      .photo-wrap{
        max-width:260px;
        margin:0 auto;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="hero">
      <div class="hero-grid">

        <!-- TEXT -->
        <div>
          <span class="badge">Финансовый директор • 20+ лет опыта</span>
          <h1>Максим Голбан</h1>
          <p class="subtitle">
            Более 20 лет опыта в финансах — от менеджера в банке до финансового директора
            промышленной группы компаний. Помогаю превратить управленческий учёт
            в реальный инструмент принятия решений.
          </p>
        </div>

        <!-- PHOTO -->
        <div class="photo-wrap">
          <img
            src="profile.jpg"
            alt="Максим Голбан — финансовый директор"
            class="photo"
          />
        </div>

      </div>
    </section>
  </main>
</body>
</html>
